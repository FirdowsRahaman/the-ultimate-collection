<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="12" y1="2" x2="12" y2="5" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="2" r="1.75" fill="#C084FC"/>
  <!-- Ears -->
  <rect x="2" y="9.5" width="2.5" height="5" rx="1.25" fill="#7C3AED"/>
  <rect x="19.5" y="9.5" width="2.5" height="5" rx="1.25" fill="#7C3AED"/>
  <!-- Head -->
  <rect x="4" y="5" width="16" height="15" rx="4" fill="url(#aiGrad)"/>
  <!-- Screen/Visor -->
  <rect x="6.5" y="8" width="11" height="8.5" rx="2.5" fill="#1E1B4B" opacity="0.8"/>
  <!-- Eyes -->
  <circle cx="9.5" cy="11.5" r="1.5" fill="#38BDF8"/>
  <circle cx="14.5" cy="11.5" r="1.5" fill="#38BDF8"/>
  <!-- Smile -->
