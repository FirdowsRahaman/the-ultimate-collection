<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="compassRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="12" cy="12" r="9.5" fill="none" stroke="url(#compassRing)" stroke-width="2.5"/>
  <!-- Dial Face -->
  <circle cx="12" cy="12" r="7.5" fill="#EDE9FE" opacity="0.25"/>
  <!-- Cardinal Tick Marks -->
  <line x1="12" y1="3" x2="12" y2="4.5" stroke="#7C3AED" stroke-width="1.8"/>
  <line x1="12" y1="19.5" x2="12" y2="21" stroke="#7C3AED" stroke-width="1.8"/>
  <line x1="3" y1="12" x2="4.5" y2="12" stroke="#7C3AED" stroke-width="1.8"/>
  <line x1="19.5" y1="12" x2="21" y2="12" stroke="#7C3AED" stroke-width="1.8"/>
  <!-- North Needle (Red/Orange) -->
  <polygon points="12,5 14.5,12 12,11" fill="#EF4444"/>
  <polygon points="12,5 9.5,12 12,11" fill="#DC2626"/>
  <!-- South Needle (Blue/Silver) -->
  <polygon points="12,19 14.5,12 12,13" fill="#94A3B8"/>
  <polygon points="12,19 9.5,12 12,13" fill="#64748B"/>
  <!-- Center Pin -->
  <circle cx="12" cy="12" r="1.5" fill="#FCD34D"/>
</svg>
